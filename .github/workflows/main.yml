name: Update places
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Download gluten-free places
        run: |
          python3 -u - <<'EOF'
          import json, os, time, urllib.request, urllib.parse
          S = ['https://overpass.private.coffee/api/interpreter', 'https://overpass-api.de/api/interpreter', 'https://maps.mail.ru/osm/tools/overpass/api/interpreter']
          G = '["diet:gluten_free"~"^(yes|only|limited)$"]'
          START = time.time()
          found, failed = {}, []
          def query(b):
              q = '[out:json][timeout:120];(nwr' + G + '["amenity"~"^(restaurant|fast_food|cafe|bar|pub|biergarten|ice_cream)$"](' + b + ');nwr' + G + '["tourism"~"^(hotel|guest_house|hostel|motel|apartment)$"](' + b + ');nwr' + G + '["shop"~"^(bakery|pastry|confectionery)$"](' + b + '););out center tags;'
              for u in S:
                  for attempt in range(2):
                      try:
                          r = urllib.request.urlopen(urllib.request.Request(u, data=urllib.parse.urlencode({'data': q}).encode(), headers={'User-Agent': 'CeliacSpot-data/1.0'}), timeout=180)
                          return json.load(r).get('elements', [])
                      except Exception as ex:
                          print('  fail', u.split('/')[2], ex)
                          time.sleep(30 if '429' in str(ex) else 5)
              return None
          def tile(s, w, n, e, d=0):
              if time.time() - START > 200 * 60:
                  failed.append((s, w, n, e))
                  return
              els = query(f'{s},{w},{n},{e}')
              if els is None:
                  if d < 2:
                      a, o = (s + n) / 2, (w + e) / 2
                      for t in [(s, w, a, o), (s, o, a, e), (a, w, n, o), (a, o, n, e)]: tile(*t, d + 1)
                  else: failed.append((s, w, n, e))
                  return
              for x in els: found[x['type'][0] + str(x['id'])] = x
              print(f'{s},{w}: {len(els)} -> total {len(found)}')
              time.sleep(1)
          for lat in range(-60, 90, 30):
              for lon in range(-180, 180, 30): tile(lat, lon, lat + 30, lon + 30)
          C = {'cafe': 'c', 'ice_cream': 'c', 'bar': 'b', 'pub': 'b', 'biergarten': 'b'}
          out = {}
          if failed and os.path.exists('places.json'):
              for p in json.load(open('places.json', encoding='utf-8')): out[p[0]] = p
          for k, x in found.items():
              t = x.get('tags', {}); c = x.get('center') or {}
              lat, lon = x.get('lat') or c.get('lat'), x.get('lon') or c.get('lon')
              if not lat or not t.get('name'): continue
              cat = 'h' if t.get('tourism') else ('c' if t.get('shop') else C.get(t.get('amenity'), 'r'))
              addr = ' '.join(filter(None, [t.get('addr:street'), t.get('addr:housenumber'), t.get('addr:postcode'), t.get('addr:city')]))
              out[k] = [k, t['name'], cat, t.get('diet:gluten_free'), round(lat, 5), round(lon, 5), addr, t.get('website') or t.get('contact:website') or '', t.get('phone') or t.get('contact:phone') or '']
          res = list(out.values())
          print('places:', len(res), 'failed tiles:', len(failed))
          if not res: raise SystemExit('no places')
          json.dump(res, open('places.json', 'w', encoding='utf-8'), ensure_ascii=False, separators=(',', ':'))
          EOF
      - name: Save
        run: |
          git config user.name "celiacspot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add places.json
          git commit -m "Update places" || echo "no changes"
          git pull --rebase
          git push
