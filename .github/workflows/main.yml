name: Update places
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Download gluten-free places
        run: |
          python3 - <<'EOF'
          import json, urllib.request, urllib.parse, time
          SERVERS = ['https://overpass-api.de/api/interpreter', 'https://overpass.private.coffee/api/interpreter', 'https://maps.mail.ru/osm/tools/overpass/api/interpreter']
          GF = '["diet:gluten_free"~"^(yes|only|limited)$"]'

          def query(s, w, n, e):
              b = f'{s},{w},{n},{e}'
              q = ('[out:json][timeout:180];('
                   f'nwr{GF}["amenity"~"^(restaurant|fast_food|cafe|bar|pub|biergarten|ice_cream)$"]({b});'
                   f'nwr{GF}["tourism"~"^(hotel|guest_house|hostel|motel|apartment)$"]({b});'
                   f'nwr{GF}["shop"~"^(bakery|pastry|confectionery)$"]({b});'
                   ');out center tags;')
              for srv in SERVERS:
                  try:
                      req = urllib.request.Request(srv, data=urllib.parse.urlencode({'data': q}).encode(), headers={'User-Agent': 'CeliacSpot-data/1.0'})
                      with urllib.request.urlopen(req, timeout=240) as r:
                          return json.load(r).get('elements', [])
                  except Exception as ex:
                      print('  fail', srv, ex)
                      time.sleep(10)
              return None

          found = {}
          failed = []

          def tile(s, w, n, e, depth=0):
              els = query(s, w, n, e)
              if els is None:
                  if depth < 3:
                      ms, mw = (s + n) / 2, (w + e) / 2
                      for t in [(s, w, ms, mw), (s, mw, ms, e), (ms, w, n, mw), (ms, mw, n, e)]:
                          tile(*t, depth + 1)
                  else:
                      failed.append((s, w, n, e))
                  return
              for el in els:
                  found[el['type'][0] + str(el['id'])] = el
              print(f'{s},{w},{n},{e}: {len(els)} places, total {len(found)}')
              time.sleep(2)

          for lat in range(-60, 80, 20):
              for lon in range(-180, 180, 20):
                  tile(lat, lon, lat + 20, lon + 20)

