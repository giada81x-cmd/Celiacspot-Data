name: Update places
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Download gluten-free places
        run: |
          python3 - <<'EOF'
          import json, urllib.request, urllib.parse, time
          q = '''[out:json][timeout:900][maxsize:1073741824];
          (
            nwr["diet:gluten_free"~"^(yes|only|limited)$"]["amenity"~"^(restaurant|fast_food|cafe|bar|pub|biergarten|ice_cream)$"];
            nwr["diet:gluten_free"~"^(yes|only|limited)$"]["tourism"~"^(hotel|guest_house|hostel|motel|apartment)$"];
            nwr["diet:gluten_free"~"^(yes|only|limited)$"]["shop"~"^(bakery|pastry|confectionery)$"];
          );
          out center tags;'''
          servers = ['https://overpass-api.de/api/interpreter', 'https://overpass.private.coffee/api/interpreter', 'https://maps.mail.ru/osm/tools/overpass/api/interpreter']
          data = None
          for s in servers:
              try:
                  req = urllib.request.Request(s, data=urllib.parse.urlencode({'data': q}).encode(), headers={'User-Agent': 'CeliacSpot-data/1.0'})
                  with urllib.request.urlopen(req, timeout=1200) as r:
                      data = json.load(r)
                  break
              except Exception as e:
                  print('failed', s, e)
                  time.sleep(30)
          if data is None:
              raise SystemExit('all servers failed')
          def cat(t):
              if t.get('tourism'): return 'h'
              a = t.get('amenity', '')
              if a in ('cafe', 'ice_cream') or t.get('shop'): return 'c'
              if a in ('bar', 'pub', 'biergarten'): return 'b'
              return 'r'
          out = []
          for e in data.get('elements', []):
              t = e.get('tags', {})
              lat = e.get('lat') or (e.get('center') or {}).get('lat')
              lon = e.get('lon') or (e.get('center') or {}).get('lon')
              if not lat or not t.get('name'):
                  continue
              addr = ' '.join(x for x in [t.get('addr:street'), t.get('addr:housenumber'), t.get('addr:postcode'), t.get('addr:city')] if x)
              out.append([e['type'][0] + str(e['id']), t['name'], cat(t), t.get('diet:gluten_free'), round(lat, 5), round(lon, 5), addr, t.get('website') or t.get('contact:website') or '', t.get('phone') or t.get('contact:phone') or ''])
          print('places:', len(out))
          with open('places.json', 'w', encoding='utf-8') as f:
              json.dump(out, f, ensure_ascii=False, separators=(',', ':'))
          EOF
      - name: Save
        run: |
          git config user.name "celiacspot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add places.json
          git commit -m "Update places" || echo "no changes"
          git push
